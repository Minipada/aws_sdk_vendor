# Runs .pre-commit-config.yaml with prek (https://prek.j178.dev) — same config as
# pre-commit, no Python environment or apt packages to install first. Same tool and
# workflow layout as ros2_data_collection's own format.yaml.

name: Formatting (prek)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # --from-ref below diffs against the base branch, which a shallow clone lacks.
          fetch-depth: 0

      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.4.14
          extra-args: ${{ github.event_name == 'pull_request' && format('--from-ref origin/{0} --to-ref HEAD', github.base_ref) || '--all-files' }}
