# Builds this package standalone via Containerfile (Podman — see CLAUDE.md
# "Containers: Podman, not Docker" in ros2_data_collection, the same convention here):
# a real `colcon build --packages-select aws_sdk_vendor` against the pinned
# AWS_SDK_VERSION tag, the same thing ros2_data_collection's own CI does when it
# builds this repo as a fetched dependency (docs/adr/0012) — this just proves the
# package builds on its own, independent of that larger workspace.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - jazzy
  push:
    branches:
      - jazzy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify podman
        run: podman --version

      - name: Build aws_sdk_vendor
        run: |
          podman build --format docker \
            --build-arg "APT_CACHEBUST=$(date -u +%Y-%m-%d)" \
            -t aws_sdk_vendor-ci:latest \
            -f Containerfile .
